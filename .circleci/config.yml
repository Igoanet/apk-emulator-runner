# Igoan Panel APK — CircleCI build (local gradle recipe ka CI port)
# Trigger: ci-build branch pe push (snapshot repo — sirf panel source, no secrets)
version: 2.1

jobs:
  build-panel-apk:
    docker:
      - image: cimg/android:2026.07.1-node
    resource_class: large # 4 vCPU / 8GB — medium (4GB) pe CMake+JVM OOM: "Gradle build daemon disappeared" (build #3 lesson)
    environment:
      CI: "1"
      # EXPO_PUBLIC_DOMAIN jaan-boojh ke UNSET — release APK apiBase.ts se
      # Railway production (backend-production-1d65.up.railway.app) pe fallback karta hai.
      EXPO_PUBLIC_SUPABASE_URL: "https://vdmxdclaizspdfqiowvv.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_SmUmzCyWYLBXYq0uiSgCBA_p8efk6Qw"
    steps:
      - checkout
      - run:
          name: pnpm setup
          command: sudo npm i -g pnpm@10 && pnpm --version
      - run:
          name: Install dependencies (frozen lockfile)
          command: pnpm install --frozen-lockfile
      - run:
          name: Android SDK licenses + components
          command: |
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run:
          name: Expo prebuild (android/ generate)
          command: CI=1 npx expo prebuild --platform android --no-install
      - run:
          name: Native patches (allowBackup=false + ABI splits)
          command: python3 scripts/ci_patch_android.py
      - run:
          name: Gradle assembleRelease
          # Lessons (build #2/#3/#4): (a) CMake compiles 10+ min silent → 45m timeout.
          # (b) Daemon OOM-crash ka culprit RAM nahi, PARALLELISM tha — max-workers=2 pe
          # per-ABI CMake tasks parallel + ninja khud saare cores pe clang spawn karta hai.
          # Local recipe (--max-workers=1) hi proven hai; ninja jobs env se cap karo.
          no_output_timeout: 45m
          environment:
            CMAKE_BUILD_PARALLEL_LEVEL: "2"
          command: |
            cd android
            echo 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' >> gradle.properties
            ./gradlew assembleRelease --no-daemon --console=plain --max-workers=1
      - run:
          name: APK outputs
          command: ls -la android/app/build/outputs/apk/release/
      - store_artifacts:
          path: android/app/build/outputs/apk/release
          destination: apk

workflows:
  build-apk:
    jobs:
      - build-panel-apk:
          filters:
            branches:
              only: ci-build
