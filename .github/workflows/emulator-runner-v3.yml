name: APK NP Manager Pipeline
# Android emulator pe Gmail (Google account) sign-in + NP Manager automation.
# Trigger: manual workflow_dispatch ya repository_dispatch (type: run-fud-pipeline).
# APKs private release assets se `gh api` se download hote hain (GITHUB_TOKEN).
# Output APK GitHub Actions artifact ke roop me upload hota hai.
# NOTE: Gmail sign-in ke liye google_apis image zaroori hai (AOSP me Google account nahi chalta).

on:
  repository_dispatch:
    types: [run-fud-pipeline]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Pipeline run ID (tag name of the draft release)"
        required: true
      apk_asset_id:
        description: "Release asset ID for input APK"
        required: true
      np_asset_id:
        description: "Release asset ID for NP Manager APK (optional)"
        required: false
        default: ""
      gmail_email:
        description: "Emulator pe sign-in karne wala Gmail (optional)"
        required: false
        default: ""
      gmail_pass:
        description: "Gmail password (optional, masked)"
        required: false
        default: ""

jobs:
  np-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # GITHUB_TOKEN ko repo content (release assets) padhne ki permission
    permissions:
      contents: write
      actions: write

    steps:
      # ── Checkout repo to get automation scripts ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Install Python dependencies ───────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -q pillow requests

      # ── Resolve inputs from dispatch event ───────────────────────────────
      - name: Resolve inputs
        id: inputs
        run: |
          # Repo kabhi hardcode nahi — hamesha current repo se resolve hota hai
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            NP_PASS="${{ github.event.client_payload.np_manager_pass }}"
            G_PASS="${{ github.event.client_payload.gmail_pass }}"
            echo "::add-mask::${NP_PASS}"
            echo "::add-mask::${G_PASS}"

            echo "RUN_ID=${{ github.event.client_payload.run_id }}"                      >> "$GITHUB_ENV"
            echo "APK_ASSET_ID=${{ github.event.client_payload.apk_asset_id }}"         >> "$GITHUB_ENV"
            echo "NP_ASSET_ID=${{ github.event.client_payload.np_asset_id }}"           >> "$GITHUB_ENV"
            echo "NP_MANAGER_EMAIL=${{ github.event.client_payload.np_manager_email }}" >> "$GITHUB_ENV"
            echo "NP_MANAGER_PASS=${NP_PASS}"                                           >> "$GITHUB_ENV"
            echo "GMAIL_EMAIL=${{ github.event.client_payload.gmail_email }}"           >> "$GITHUB_ENV"
            echo "GMAIL_PASS=${G_PASS}"                                                 >> "$GITHUB_ENV"
          else
            G_PASS="${{ github.event.inputs.gmail_pass }}"
            echo "::add-mask::${G_PASS}"
            echo "RUN_ID=${{ github.event.inputs.run_id }}"                              >> "$GITHUB_ENV"
            echo "APK_ASSET_ID=${{ github.event.inputs.apk_asset_id }}"                 >> "$GITHUB_ENV"
            echo "NP_ASSET_ID=${{ github.event.inputs.np_asset_id }}"                   >> "$GITHUB_ENV"
            echo "GMAIL_EMAIL=${{ github.event.inputs.gmail_email }}"                   >> "$GITHUB_ENV"
            echo "GMAIL_PASS=${G_PASS}"                                                 >> "$GITHUB_ENV"
          fi

      # ── Enable KVM for hardware acceleration ──────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Copy automation scripts to home dir ───────────────────────────────
      - name: Set up automation scripts
        run: |
          mkdir -p ~/github_automation
          cp github_automation/np_manager_v3.py ~/github_automation/
          cp github_automation/gmail_login.py    ~/github_automation/
          chmod +x github_automation/run_pipeline_v3.sh

      # ── Start Android emulator and run pipeline ───────────────────────────
      - name: Run Gmail + NP Manager on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # gh CLI uses GITHUB_TOKEN automatically on Actions runners
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot-save
          disable-animations: true
          script: bash github_automation/run_pipeline_v3.sh

      # ── Upload output APK as artifact ─────────────────────────────────────
      - name: Upload output APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np-pipeline-output-${{ env.RUN_ID }}
          path: |
            ~/fud-work/output/android_hardened.apk
          retention-days: 1
          if-no-files-found: warn

      # ── Upload logs for debugging ─────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: np-pipeline-logs-${{ env.RUN_ID }}
          path: |
            ~/fud-work/logs/
            ~/fud-work/output/screenshots/
          retention-days: 1
          if-no-files-found: warn
