kind = "mobile"
previewPath = "/igoan-panel/"
title = "Igon Panel"
version = "1.0.0"
id = "artifacts/igoan-panel"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/igoan-panel/" ]
localPort = 24650

[services.development]
run = "pnpm --filter @workspace/igoan-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/igoan-panel", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/igoan-panel", "run", "serve" ]

[services.env]
PORT = "24650"
BASE_PATH = "/igoan-panel/"
